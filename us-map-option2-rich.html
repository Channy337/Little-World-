<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Civoria #2 Rich U.S. Preview</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b100e;color:#eef2e8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}body{height:100vh}.app{height:100vh;display:flex;flex-direction:column}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:#101713;border-bottom:1px solid #314137}.t{font-weight:800;font-size:14px}.s{font-size:11px;color:#aab8ad}.btns{display:flex;gap:7px}.btns button{background:#1b2821;color:#edf4eb;border:1px solid #405448;border-radius:7px;padding:8px 10px;font:inherit}.view{position:relative;flex:1;overflow:hidden;background:linear-gradient(#376d7d,#275a6a);touch-action:none}.map{width:100%;height:100%;display:block}.load{position:absolute;inset:0;display:grid;place-items:center;background:#18323a;z-index:4}.hud{position:absolute;left:10px;bottom:10px;max-width:270px;background:#0d1511dd;border:1px solid #ffffff22;border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.45}.state{stroke:#2b3e2e;stroke-width:1;vector-effect:non-scaling-stroke}.river{fill:none;stroke:#76bdd0;stroke-width:2.4;opacity:.82;vector-effect:non-scaling-stroke}.road{fill:none;stroke:#d5bc76;stroke-width:1.2;stroke-dasharray:3 3;opacity:.55;vector-effect:non-scaling-stroke}.label{font-size:8px;fill:#f4f2d9;paint-order:stroke;stroke:#172117;stroke-width:2.5;font-weight:800}.tree1{fill:#2f5b36}.tree2{fill:#447f44}.trunk{fill:#66462e}.rock{fill:#7c8078}.snow{fill:#dce1d9}.roof{fill:#6b3928}.wall{fill:#c29462}.dark{fill:#402b20}.water{fill:#4d91a0;stroke:#2d6570;stroke-width:.8}.fire{fill:#ffb14a}.ember{fill:#ffdd77}.skin{fill:#d89a6c}.shirt{fill:#6b86b8}.pants{fill:#303d42}.limb{stroke:#d89a6c;stroke-width:2;stroke-linecap:square;vector-effect:non-scaling-stroke}.leg{stroke:#303d42;stroke-width:2.1;stroke-linecap:square;vector-effect:non-scaling-stroke}.cloud{fill:#f1f5ee;opacity:.58}.smoke{fill:#cdd4cc;opacity:.38}.shade{fill:#132018;opacity:.24}.mini{position:absolute;right:10px;bottom:10px;width:128px;height:82px;border:1px solid #ffffff22;background:#0c1411bb;border-radius:8px;overflow:hidden}.mini svg{width:100%;height:100%}.viewbox{fill:none;stroke:#ffe59a;stroke-width:2}.note{color:#bfe8b7}@media(max-width:620px){.s{display:none}.bar{align-items:flex-start}.hud{max-width:205px;font-size:10px}.mini{width:105px;height:68px}}</style></head><body><div class="app"><div class="bar"><div><div class="t">CIVORIA • #2 RICH PIXEL DIRECTION</div><div class="s">Visual proof only • drag to travel • pinch / buttons to zoom</div></div><div class="btns"><button id="zi">＋</button><button id="zo">－</button><button id="home">Home</button></div></div><div class="view"><div id="load" class="load">Painting the richer U.S. world…</div><svg id="svg" class="map" viewBox="0 0 1400 860"></svg><div class="hud"><span class="note">Goal:</span> test the #2 feel before touching production. This uses richer browser-made art, not final hand-authored sprites.</div><div class="mini"><svg id="mini" viewBox="0 0 1400 860"></svg></div></div></div><script type="module">(async()=>{const load=document.getElementById('load');try{const[d3,topo,{default:us}]=await Promise.all([import('https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm'),import('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm'),import('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json/+esm')]);const svg=d3.select('#svg'),mini=d3.select('#mini'),W=1400,H=860;svg.append('rect').attr('width',W).attr('height',H).attr('fill','#356c7c');const states=topo.feature(us,us.objects.states).features.filter(d=>![2,15,72].includes(+d.id)),fc={type:'FeatureCollection',features:states};const projection=d3.geoAlbersUsa().fitExtent([[60,45],[1340,815]],fc),path=d3.geoPath(projection),defs=svg.append('defs');defs.append('clipPath').attr('id','clip').selectAll('path').data(states).join('path').attr('d',path);const world=svg.append('g');world.selectAll('path').data(states).join('path').attr('class','state').attr('d',path).attr('fill',(d,i)=>['#799d5e','#6f9558','#82a564'][i%3]);const detail=world.append('g').attr('clip-path','url(#clip)');function rnd(i){const x=Math.sin(i*912.37)*43758.5453;return x-Math.floor(x)}function ll(i){for(let k=0;k<60;k++){const lon=-124+rnd(i*17+k)*58,lat=25+rnd(i*29+k)*24,p=projection([lon,lat]);if(p&&d3.geoContains(fc,[lon,lat]))return p}return null}for(let i=0;i<620;i++){const p=ll(i+11);if(!p)continue;const[x,y]=p,t=rnd(i*5);if(t<.73){const g=detail.append('g').attr('transform',`translate(${x},${y}) scale(${.55+rnd(i*9)*.7})`);g.append('rect').attr('class','trunk').attr('x',-1).attr('y',0).attr('width',2).attr('height',6);g.append('rect').attr('class','tree1').attr('x',-5).attr('y',-6).attr('width',10).attr('height',6);g.append('rect').attr('class','tree2').attr('x',-4).attr('y',-10).attr('width',8).attr('height',6)}else{const g=detail.append('g').attr('transform',`translate(${x},${y}) scale(${.55+rnd(i*7)*.8})`);g.append('path').attr('class','rock').attr('d','M-7,6 L0,-9 L8,6 Z');g.append('path').attr('class','snow').attr('d','M-3,-3 L0,-9 L4,-2 L1,-4 L0,-1 Z')}}const line=d3.line().curve(d3.curveBasis);[[[-121,47],[-118,43],[-115,39],[-112,35],[-108,32]],[[-95,48],[-94,43],[-92,39],[-91,35],[-90,30]],[[-85,45],[-83,41],[-82,36],[-81,31]]].forEach(r=>{const p=r.map(projection).filter(Boolean);world.append('path').attr('class','river').attr('d',line(p))});world.append('path').attr('class','road').attr('d',line([[-122,38],[-116,36],[-110,35],[-103,37],[-97,38],[-91,39],[-85,40],[-79,40],[-74,41]].map(projection).filter(Boolean)));const settlements=[[-121.5,45.4],[-117.3,34.3],[-111.7,40.7],[-104.9,39.7],[-97.5,35.5],[-95.3,29.8],[-90.2,38.6],[-84.4,33.8],[-81.6,28.5],[-77,39],[-73.8,42.8]];const actors=[],smokes=[];settlements.forEach((llv,si)=>{const p=projection(llv);if(!p)return;const[x,y]=p,g=world.append('g').attr('transform',`translate(${x},${y})`);g.append('ellipse').attr('class','shade').attr('cx',0).attr('cy',16).attr('rx',28).attr('ry',7);for(let h=0;h<3;h++){const hx=(h-1)*18,hy=(h%2)*5;const hg=g.append('g').attr('transform',`translate(${hx},${hy})`);hg.append('rect').attr('class','wall').attr('x',-7).attr('y',-5).attr('width',14).attr('height',12);hg.append('path').attr('class','roof').attr('d','M-9,-5 L0,-13 L9,-5 Z');hg.append('rect').attr('class','dark').attr('x',-1.5).attr('y',2).attr('width',3).attr('height',5);const sm=hg.append('g').attr('transform','translate(5,-14)');for(let s=0;s<3;s++){const c=sm.append('circle').attr('class','smoke').attr('r',2.5-s*.4);smokes.push({c,phase:si+h+s*1.2,baseY:-s*4})}}g.append('circle').attr('class','fire').attr('cy',16).attr('r',4);g.append('circle').attr('class','ember').attr('cy',15).attr('r',1.6);const pond=g.append('g').attr('transform','translate(28,12)');pond.append('ellipse').attr('class','water').attr('rx',11).attr('ry',5);for(let j=0;j<4;j++){const pg=g.append('g').attr('transform',`translate(${(j-1.5)*9},${22+(j%2)*3})`);pg.append('line').attr('class','leg').attr('x1',-1).attr('y1',6).attr('x2',-2).attr('y2',11);pg.append('line').attr('class','leg').attr('x1',1).attr('y1',6).attr('x2',2).attr('y2',11);pg.append('rect').attr('class','shirt').attr('x',-2.5).attr('y',0).attr('width',5).attr('height',7);const al=pg.append('line').attr('class','limb').attr('x1',-2).attr('y1',2.5);const ar=pg.append('line').attr('class','limb').attr('x1',2).attr('y1',2.5);pg.append('circle').attr('class','skin').attr('cy',-3).attr('r',3);actors.push({g:pg,al,ar,phase:si*.8+j*1.6,mode:j%3})}g.append('text').attr('class','label').attr('text-anchor','middle').attr('y',-19).text('settlement '+(si+1))});const clouds=[];for(let i=0;i<12;i++){const g=world.append('g').attr('class','cloud');g.append('rect').attr('x',-20).attr('y',-5).attr('width',40).attr('height',10).attr('rx',5);g.append('rect').attr('x',-10).attr('y',-10).attr('width',22).attr('height',10).attr('rx',5);clouds.push({g,x:rnd(i+80)*W,y:80+rnd(i+20)*320,s:5+rnd(i+3)*7})}mini.append('rect').attr('width',W).attr('height',H).attr('fill','#244b56');mini.selectAll('path').data(states).join('path').attr('d',path).attr('fill','#76965b').attr('stroke','#26372a').attr('stroke-width',1.2);const box=mini.append('rect').attr('class','viewbox');let current=d3.zoomIdentity.translate(-300,-120).scale(1.7);const zoom=d3.zoom().scaleExtent([1.2,7]).on('zoom',e=>{current=e.transform;world.attr('transform',current);const k=current.k,vw=W/k,vh=H/k;box.attr('x',-current.x/k).attr('y',-current.y/k).attr('width',vw).attr('height',vh)});svg.call(zoom).call(zoom.transform,current);document.getElementById('zi').onclick=()=>svg.transition().duration(220).call(zoom.scaleBy,1.35);document.getElementById('zo').onclick=()=>svg.transition().duration(220).call(zoom.scaleBy,.74);document.getElementById('home').onclick=()=>svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity.translate(-300,-120).scale(1.7));const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function anim(ms){const t=ms/1000;if(!reduced){actors.forEach(a=>{const q=Math.sin(t*2.6+a.phase);if(a.mode===0){a.al.attr('x2',-5-q*2).attr('y2',5-q*2);a.ar.attr('x2',5+q*2).attr('y2',5+q*1.5)}else if(a.mode===1){a.g.attr('transform',`translate(${Math.sin(t+a.phase)*2},${22+Math.abs(Math.sin(t*2+a.phase))*1.5})`);a.al.attr('x2',-4).attr('y2',6);a.ar.attr('x2',4).attr('y2',6)}else{a.al.attr('x2',-5).attr('y2',4+q*2);a.ar.attr('x2',5).attr('y2',4-q*2)}});clouds.forEach(c=>{c.x+=c.s*.01;if(c.x>W+40)c.x=-40;c.g.attr('transform',`translate(${c.x},${c.y})`)});smokes.forEach(s=>s.c.attr('cy',s.baseY-((t*5+s.phase)%12)).attr('cx',Math.sin(t+s.phase)*2).attr('opacity',.42-(((t*5+s.phase)%12)/30)))}requestAnimationFrame(anim)}requestAnimationFrame(anim);load.remove()}catch(err){load.textContent='Could not load the map data. '+err.message;load.style.color='#ffb4a8'}})();</script></body></html>
